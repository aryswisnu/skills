<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Ticket Loop</title>
  <desc id="desc">Black spiked paint across the text slash ticket hyphen loop, on grey paper, above a plain checklist: plan, approve, and steps ticked, done open</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="rough" x="-5%" y="-30%" width="110%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="5"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="#e6e6e3"/>
  <rect width="1200" height="320" fill="#000" filter="url(#grain)"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="3" fill="#0a0a0a">
    <text x="36" y="40">FORM TL-01</text>
    <text x="1164" y="40" text-anchor="end">STATUS: IN PROGRESS</text>
    <path d="M36 52H1164" stroke="#0a0a0a" stroke-width="1.5"/>
  </g>

  <path d="M160 136.0 Q190 100 230 96 L280 94 Q288.4 75.3 268.4 60 Q295.6 78.7 304 94 L390 94 Q399.8 58.8 375.8 30 Q408.2 65.2 418 94 L509 94 Q516.7 72.0 512.8 54 Q523.3 76.0 531 94 L669 94 Q676.7 72.0 687.2 54 Q683.3 76.0 691 94 L782 94 Q791.8 58.8 824.2 30 Q800.2 65.2 810 94 L896 94 Q904.4 75.3 931.6 60 Q911.6 78.7 920 94 L970 96 Q1010 100 1040 136.0 Q1010 174 970 178 L942 178 Q933.0 196.0 943.4 208 Q927.0 190.0 918 178 L825 178 Q815.2 204.4 824.6 222 Q808.8 195.6 799 178 L739 178 Q732.2 193.6 734.6 204 Q727.8 188.4 721 178 L650 178 Q642.5 202.0 642.2 218 Q637.5 194.0 630 178 L570 178 Q562.5 202.0 557.8 218 Q557.5 194.0 550 178 L479 178 Q472.2 193.6 465.4 204 Q467.8 188.4 461 178 L401 178 Q391.2 204.4 375.4 222 Q384.8 195.6 375 178 L282 178 Q273.0 196.0 256.6 208 Q267.0 190.0 258 178 L230 178 Q190 174 160 136.0 Z" fill="#0a0a0a" filter="url(#rough)"/>
  <text x="600" y="156" fill="#f4f4f1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="68" font-weight="800" letter-spacing="-2" text-anchor="middle">/ticket-loop</text>

  <text x="600" y="250" fill="#0a0a0a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="4" text-anchor="middle">ONE TICKET. PLAN TO DONE. IT DOES NOT STOP HALFWAY.</text>
  <rect x="350" y="266" width="20" height="20" fill="none" stroke="#0a0a0a" stroke-width="2.5"/><path d="M354 276l5 6l10 -13" fill="none" stroke="#0a0a0a" stroke-width="3" stroke-linecap="square"/><text x="380" y="282" fill="#0a0a0a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="2">PLAN</text><rect x="458" y="266" width="20" height="20" fill="none" stroke="#0a0a0a" stroke-width="2.5"/><path d="M462 276l5 6l10 -13" fill="none" stroke="#0a0a0a" stroke-width="3" stroke-linecap="square"/><text x="488" y="282" fill="#0a0a0a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="2">APPROVE</text><rect x="599" y="266" width="20" height="20" fill="none" stroke="#0a0a0a" stroke-width="2.5"/><path d="M603 276l5 6l10 -13" fill="none" stroke="#0a0a0a" stroke-width="3" stroke-linecap="square"/><text x="629" y="282" fill="#0a0a0a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="2">STEPS</text><rect x="718" y="266" width="20" height="20" fill="none" stroke="#0a0a0a" stroke-width="2.5"/><text x="748" y="282" fill="#0a0a0a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="2">DONE</text>
  <path d="M36 300H1164" stroke="#0a0a0a" stroke-width="1.5"/>
</svg>
