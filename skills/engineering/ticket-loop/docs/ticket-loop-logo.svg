        <text x="600" y="34" text-anchor="middle">ONE TICKET, FROM PLAN TO DONE</text>
        <text x="1160" y="34" text-anchor="end">PRICE: ONE APPROVAL</text>
      </g>
      <path d="M40 44H1160" stroke="#111" stroke-width="1"/>
    </g>
