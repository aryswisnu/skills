      <path d="M40 146H1160M40 151H1160" stroke="#111" stroke-width="1.6"/>
      <path d="M40 181H1160" stroke="#111" stroke-width="1.6"/>
    </g>
    <g filter="url(#toner-fine)" font-family="Georgia, 'Times New Roman', Times, serif" font-size="13" font-weight="700" letter-spacing="2.5">
      <text x="40" y="171">LATE EDITION</text>
      <text x="600" y="171" text-anchor="middle">PLAN · APPROVE · STEPS · DONE</text>
      <text x="1160" y="171" text-anchor="end">WEATHER: STOP HOOK ARMED</text>
    </g>
    <g filter="url(#toner)">
      <text x="40" y="236" font-family="TLHead, Georgia, 'Times New Roman', Times, serif" font-weight="700" font-size="44" textLength="790" lengthAdjust="spacingAndGlyphs">TICKET WORKED UNTIL DONE, AUTONOMOUSLY</text>
      <g filter="url(#screen)"><rect x="860" y="206" width="300" height="160" fill="url(#dots)" mask="url(#pic)"/></g>
      <rect x="860" y="206" width="300" height="160" fill="none" stroke="#111" stroke-width="1.6"/>
    </g>
    <g filter="url(#toner-fine)">
      <text x="40" y="266" font-family="Georgia, 'Times New Roman', Times, serif" font-size="17" font-style="italic">Approve the plan once. The agent does the rest, step by step, and no one asks what is next.</text>
      <text y="296" font-family="Georgia, 'Times New Roman', Times, serif" font-size="12.5"><tspan x="40" dy="0">Approve the plan one time, and the</tspan><tspan x="40" dy="15">ticket is worked until it is done.</tspan><tspan x="40" dy="15">The agent reads the ticket and the</tspan><tspan x="40" dy="15">code, and it writes the plan before</tspan><tspan x="40" dy="15">it touches anything.</tspan></text><text y="296" font-family="Georgia, 'Times New Roman', Times, serif" font-size="12.5"><tspan x="302" dy="0">Then it works every step on its own:</tspan><tspan x="302" dy="15">branch, fix, test, PR, review, and</tspan><tspan x="302" dy="15">QA. A checklist page shows each step</tspan><tspan x="302" dy="15">as it happens, live in the browser.</tspan></text><path d="M290 286V384" stroke="#111" stroke-width="1"/><text y="296" font-family="Georgia, 'Times New Roman', Times, serif" font-size="12.5"><tspan x="564" dy="0">When it tries to stop early, a Stop</tspan><tspan x="564" dy="15">hook sends it back to the next step.</tspan><tspan x="564" dy="15">It never merges. It lets go when</tspan><tspan x="564" dy="15">something breaks, or when it is</tspan><tspan x="564" dy="15">stuck.</tspan></text><path d="M552 286V384" stroke="#111" stroke-width="1"/>
      <text x="860" y="386" font-family="Georgia, 'Times New Roman', Times, serif" font-size="12" font-style="italic">FIG. 1: The loop. It ends when the ticket is done.</text>
      <path d="M40 400H1160" stroke="#111" stroke-width="1.6"/>
    </g>
  </g>

  <rect width="1200" height="420" fill="#000" filter="url(#specks)"/>
  <path d="M0 96H1200" stroke="#000" stroke-width="0.8" opacity="0.16"/>
  <path d="M0 274H1200" stroke="#000" stroke-width="1.6" opacity="0.09"/>
  <path d="M842 0V420" stroke="#000" stroke-width="1" opacity="0.08"/>
  <rect width="1200" height="420" fill="url(#lid)"/>
  <rect width="1200" height="420" fill="url(#fade)"/>
</svg>
