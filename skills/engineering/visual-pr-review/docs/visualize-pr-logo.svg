<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Visualize PR</title>
  <desc id="desc">A before and after code review mark beside the text slash visualize hyphen PR</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#080c17"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="1196" height="316" rx="28" fill="url(#panel)" stroke="#263244" stroke-width="4"/>
  <path d="M36 276H1164" stroke="url(#accent)" stroke-width="3" opacity="0.75"/>

  <!-- Before and after preview mark -->
  <g transform="translate(48 54)">
    <rect width="250" height="196" rx="18" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <path d="M125 0V196" stroke="#475569" stroke-width="3"/>
    <rect x="14" y="16" width="96" height="24" rx="7" fill="#1e293b"/>
    <text x="62" y="33" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">BEFORE</text>
    <rect x="140" y="16" width="96" height="24" rx="7" fill="#164e63"/>
    <text x="188" y="33" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">AFTER</text>

    <rect x="18" y="60" width="86" height="8" rx="4" fill="#64748b"/>
    <rect x="18" y="82" width="72" height="8" rx="4" fill="#475569"/>
    <rect x="18" y="104" width="90" height="8" rx="4" fill="#64748b"/>
    <rect x="18" y="126" width="62" height="8" rx="4" fill="#475569"/>
    <rect x="18" y="148" width="82" height="8" rx="4" fill="#64748b"/>

    <rect x="143" y="60" width="86" height="8" rx="4" fill="#64748b"/>
    <rect x="143" y="82" width="72" height="8" rx="4" fill="#475569"/>
    <rect x="143" y="101" width="92" height="14" rx="5" fill="#0891b2" filter="url(#glow)"/>
    <rect x="143" y="126" width="62" height="8" rx="4" fill="#475569"/>
    <rect x="143" y="148" width="82" height="8" rx="4" fill="#64748b"/>

    <circle cx="223" cy="168" r="25" fill="#111827" stroke="#a78bfa" stroke-width="4"/>
    <path d="M240 186L258 204" stroke="#a78bfa" stroke-width="7" stroke-linecap="round"/>
    <path d="M212 168L220 176L235 158" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="350" y="136" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="66" font-weight="800" letter-spacing="-3">/visualize-pr</text>
  <text x="354" y="180" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="22" font-weight="500" letter-spacing="1.5">CODE CHANGES, MADE VISIBLE</text>

  <g transform="translate(354 210)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700">
    <rect width="94" height="32" rx="9" fill="#1e293b" stroke="#475569"/>
    <text x="47" y="21" fill="#cbd5e1" text-anchor="middle">BEFORE</text>
    <path d="M112 16H146" stroke="#64748b" stroke-width="2"/>
    <path d="M140 10L148 16L140 22" fill="none" stroke="#64748b" stroke-width="2"/>
    <rect x="164" width="88" height="32" rx="9" fill="#164e63" stroke="#0891b2"/>
    <text x="208" y="21" fill="#67e8f9" text-anchor="middle">AFTER</text>
    <rect x="270" width="76" height="32" rx="9" fill="#3b0764" stroke="#7e22ce"/>
    <text x="308" y="21" fill="#d8b4fe" text-anchor="middle">DIFF</text>
    <rect x="364" width="150" height="32" rx="9" fill="#052e16" stroke="#15803d"/>
    <text x="439" y="21" fill="#86efac" text-anchor="middle">HUMAN REVIEW</text>
  </g>
</svg>
