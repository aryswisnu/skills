<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visual PR Review Demo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f5f5; color: #2d3142; font: 18px/1.5 system-ui, sans-serif; }
    main { width: min(760px, calc(100% - 48px)); padding: 56px; background: #fff; border: 2px solid #2d3142; box-shadow: 12px 12px 0 #eb6c36; border-radius: 18px; }
    h1 { max-width: 620px; font-size: 3.2rem; line-height: 1.05; }
    p { max-width: 560px; color: #555b70; }
    button, a.cta { display: inline-block; margin-top: 18px; padding: 12px 18px; color: #11151c; background: #eb6c36; border: 0; border-radius: 999px; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; }
    #panel[hidden] { display: none; }
    #panel { margin-top: 24px; padding: 18px; border: 1px dashed #eb6c36; border-radius: 12px; }
    .rendered-at { color: #6b7080; font-size: 0.8rem; }
  </style>
</head>
<body>
  <main>
    <small>VISUAL PR REVIEW</small>
    <h1>Review the change, not the setup.</h1>
    <p>Authors capture stable before and after evidence. Reviewers can focus on judgment instead of rebuilding both revisions.</p>
    <button id="open-evidence" type="button">See the evidence</button>
    <a class="cta" href="/details">Open details</a>
    <div id="panel" hidden>
      <p id="panel-text">Evidence panel: before, after, side-by-side, pixel diff.</p>
    </div>
    <p class="rendered-at">rendered at <span id="clock"></span></p>
  </main>
  <script>
    document.getElementById('open-evidence').addEventListener('click', () => {
      document.getElementById('panel').hidden = false;
    });
    // Non-deterministic on purpose: the demo config hides it with `capture.hideSelectors`.
    document.getElementById('clock').textContent = new Date().toISOString();
  </script>
</body>
</html>
