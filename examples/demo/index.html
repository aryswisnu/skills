<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visual PR Review Demo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f2efe8; color: #20242b; font: 18px/1.5 system-ui, sans-serif; }
    main { width: min(760px, calc(100% - 48px)); padding: 56px; background: white; border: 2px solid #20242b; box-shadow: 12px 12px 0 #d5cec1; }
    p { max-width: 560px; }
    a { display: inline-block; margin-top: 18px; padding: 12px 18px; color: white; background: #20242b; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <small>VISUAL PR REVIEW</small>
    <h1>Make the diff easier to see.</h1>
    <p>Authors capture a stable before and after view. Reviewers spend their attention on judgment, not archaeology.</p>
    <a href="#details">See the evidence</a>
  </main>
</body>
</html>
