<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Details · Visual PR Review Demo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #11151c; color: #ecf2ff; font: 18px/1.5 system-ui, sans-serif; }
    main { width: min(680px, calc(100% - 48px)); padding: 48px; background: #19202b; border: 2px solid #8f7bff; border-radius: 18px; }
    h1 { font-size: 2.4rem; }
    li { color: #bac7da; }
  </style>
</head>
<body>
  <main>
    <h1>What the reviewer gets</h1>
    <ul>
      <li>Before and after captures from two git revisions</li>
      <li>A labelled side-by-side image</li>
      <li>A pixel diff and a thresholded verdict</li>
      <li>Runtime and semantic evidence, per revision</li>
    </ul>
  </main>
</body>
</html>
